# Cores nativas do Streamlit (tabela editável, menus, campos) — combinam com o tema do BinderLog.
# Com [theme.light] e [theme.dark], o Streamlit acompanha o modo claro/escuro do sistema.
[theme.light]
primaryColor = "#6b46f0"
backgroundColor = "#faf7ff"
secondaryBackgroundColor = "#f1ecff"
textColor = "#241d44"
font = "sans serif"

[theme.dark]
primaryColor = "#9a86ff"
backgroundColor = "#0d0b1a"
secondaryBackgroundColor = "#171330"
textColor = "#f5f2ff"
font = "sans serif"
